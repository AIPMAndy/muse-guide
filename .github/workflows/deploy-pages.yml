name: Test and deploy Muse Atlas
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: muse-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON syntax
        run: python3 -m json.tool data/library.json > /dev/null
      - name: Check JavaScript syntax
        run: |
          node --check assets/site.js && node --check assets/reader.js
          python3 -c "from pathlib import Path; h=Path('sources.html').read_text(); Path('/tmp/muse-source.js').write_text(h.rsplit('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/muse-source.js
      - name: Run standard library tests
        run: python3 -m unittest discover -s tests -v
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
  verify-live:
    if: github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check actual deployed website and historical PDF bytes
        run: python3 scripts/verify_live.py
